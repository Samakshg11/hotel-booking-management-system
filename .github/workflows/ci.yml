name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Frontend Client
        run: npm --prefix client run build

      - name: Run Backend Tests
        run: npm --prefix server test -- --coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_secret_key_minimum_32_characters_length
          MONGODB_URI: mongodb://127.0.0.1:27017/hotel_test
