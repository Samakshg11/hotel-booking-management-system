openapi: 3.0.3
info:
  title: Grand Horizon Hotel Management API
  description: >
    Production-ready modular monolith API built for the Algions AI Labs take-home assessment.
    Features:
    - Server-side RBAC (guest, staff, admin)
    - Zero double-booking concurrency engine via MongoDB compound unique index { roomId: 1, date: 1 }
    - Multi-document ACID transactions
    - Deterministic payment simulation with Idempotency-Key protection
    - Centralized State Machine (TRANSITIONS)
    - Reconciled Financial & Occupancy Aggregation Pipelines
    - Append-only audit logging
  version: 1.0.0
servers:
  - url: /api/v1
    description: API v1 Base Path

paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: Service is healthy

  /auth/register:
    post:
      summary: Register a new guest account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                phone: { type: string }
      responses:
        '201': { description: Guest registered successfully }
        '400': { description: Validation error }
        '409': { description: Email already taken }

  /auth/login:
    post:
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Login successful with JWT token }
        '401': { description: Invalid credentials }

  /auth/me:
    get:
      summary: Get current authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200': { description: User profile }
        '401': { description: Unauthenticated }

  /room-types:
    get:
      summary: List all active room types (Public)
      responses:
        '200': { description: List of room types }
    post:
      summary: Create new room type (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, capacity, baseRate]
              properties:
                name: { type: string }
                capacity: { type: integer, minimum: 1 }
                baseRate: { type: integer, minimum: 0, description: "paise" }
                amenities: { type: array, items: { type: string } }
      responses:
        '201': { description: Room type created }
        '403': { description: Forbidden }

  /rooms:
    get:
      summary: List physical rooms (Staff & Admin)
      security:
        - BearerAuth: []
      responses:
        '200': { description: List of rooms }
    post:
      summary: Create physical room (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomNumber, roomTypeId, floor]
              properties:
                roomNumber: { type: string }
                roomTypeId: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, maintenance, out_of_service] }
      responses:
        '201': { description: Room created }

  /rooms/{id}/status:
    patch:
      summary: Update housekeeping/maintenance status (Staff & Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [available, maintenance, out_of_service] }
      responses:
        '200': { description: Room status updated }

  /availability:
    get:
      summary: Search real-time room availability with pricing breakdown
      parameters:
        - in: query
          name: checkIn
          required: true
          schema: { type: string, format: date }
        - in: query
          name: checkOut
          required: true
          schema: { type: string, format: date }
        - in: query
          name: guests
          schema: { type: integer, minimum: 1 }
        - in: query
          name: roomTypeId
          schema: { type: string }
      responses:
        '200': { description: Available room types and itemized rates }
        '400': { description: Invalid date or duration }

  /bookings/hold:
    post:
      summary: Hold a room atomically with transaction and duplicate-key fallback
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomTypeId, checkIn, checkOut, guests]
              properties:
                roomTypeId: { type: string }
                checkIn: { type: string, format: date }
                checkOut: { type: string, format: date }
                guests: { type: integer, minimum: 1 }
                guestDetails:
                  type: object
                  properties:
                    fullName: { type: string }
                    email: { type: string }
                    phone: { type: string }
      responses:
        '201': { description: Hold created with reference HB-YYYYMMDD-XXXXX }
        '409': { description: No availability for chosen dates }

  /bookings/{id}/confirm:
    post:
      summary: Confirm a held reservation with simulated payment (Requires Idempotency-Key)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardNumber]
              properties:
                cardNumber: { type: string, description: "Card ending 0000 declines, others succeed" }
      responses:
        '200': { description: Booking confirmed }
        '400': { description: Payment declined }
        '410': { description: Hold expired }
        '422': { description: Idempotency key reused with different payload }

  /bookings/{id}/cancel:
    post:
      summary: Cancel reservation and apply 24h refund policy
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Booking cancelled and room released }

  /bookings/mine:
    get:
      summary: List guest own booking history
      security:
        - BearerAuth: []
      responses:
        '200': { description: Guest booking list }

  /bookings:
    get:
      summary: List all bookings with search/filter (Staff & Admin)
      security:
        - BearerAuth: []
      responses:
        '200': { description: Filtered bookings list }

  /bookings/{id}/check-in:
    post:
      summary: Check in guest on arrival date (Staff & Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Checked in }
        '400': { description: Early check-in prohibited }

  /bookings/{id}/check-out:
    post:
      summary: Check out guest (Staff & Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Checked out }

  /guests:
    get:
      summary: Search guest directory (Staff & Admin)
      security:
        - BearerAuth: []
      responses:
        '200': { description: Guest directory }

  /guests/{id}:
    get:
      summary: View guest profile with full stay history (Staff & Admin)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Guest details with bookings }

  /reports/summary:
    get:
      summary: Aggregated financial and occupancy report (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200': { description: Reconciled revenue and occupancy rate }

  /reports/arrivals:
    get:
      summary: Expected arrivals (Staff & Admin)
      security:
        - BearerAuth: []
      responses:
        '200': { description: Arrivals list }

  /reports/departures:
    get:
      summary: Expected departures (Staff & Admin)
      security:
        - BearerAuth: []
      responses:
        '200': { description: Departures list }

  /audit-logs:
    get:
      summary: Inspect audit log records (Admin only)
      security:
        - BearerAuth: []
      responses:
        '200': { description: Audit log records }

  /admin/users/{id}/role:
    patch:
      summary: Change user role (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [guest, staff, admin] }
      responses:
        '200': { description: User role updated and logged }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
