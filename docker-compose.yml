services:
  mongo:
    image: mongo:7.0
    container_name: hotel-mongo-rs
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: test $$(echo "rs.status().ok || rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok" | mongosh --port 27017 --quiet) -eq 1
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 3s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hotel-server
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/hotel_management?replicaSet=rs0
      - JWT_SECRET=super_secret_jwt_key_for_takehome_demo_only_min_32_characters_long
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - HOLD_MINUTES=10
      - TAX_RATE=0.12
      - ALLOW_EARLY_CHECKIN=false
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hotel-client
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5001/api/v1
    depends_on:
      - server

volumes:
  mongo-data:
